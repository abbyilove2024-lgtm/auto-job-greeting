<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>历史记录 — Auto Job Greeting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #333;
      background: #f7f8fa;
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-title { font-size: 16px; font-weight: 600; }
    .topbar-actions { display: flex; gap: 8px; }
    .topbar-btn {
      padding: 5px 12px;
      border: 1px solid rgba(255,255,255,.5);
      background: transparent;
      color: #fff;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
    }
    .topbar-btn:hover { background: rgba(255,255,255,.15); }

    /* ── 统计卡片 ─────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 14px 16px 0;
    }
    .stat-card {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e8e8e8;
      padding: 12px 14px;
      text-align: center;
    }
    .stat-value { font-size: 20px; font-weight: 700; color: #667eea; margin-bottom: 2px; }
    .stat-label { font-size: 11px; color: #999; }

    /* ── 筛选栏 ───────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #eee;
      margin-top: 12px;
    }
    .filter-bar select,
    .filter-bar input[type="date"] {
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      color: #555;
      outline: none;
      background: #fff;
    }
    .filter-bar select:focus,
    .filter-bar input[type="date"]:focus {
      border-color: #667eea;
    }
    .filter-bar .spacer { flex: 1; }

    /* ── 记录列表 ─────────────────────────────── */
    .list-container { padding: 12px 16px; }

    .record-item {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e8e8e8;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .record-item:hover {
      border-color: #c5cae9;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .record-item.expanded { border-color: #667eea; }

    .record-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .record-main { flex: 1; }
    .record-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .record-meta { font-size: 12px; color: #888; }
    .record-right { text-align: right; flex-shrink: 0; }
    .record-time { font-size: 11px; color: #bbb; margin-bottom: 4px; }

    /* 状态标签 */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-success { background: #e8f5e9; color: #2e7d32; }
    .badge-failed  { background: #fce8e6; color: #c62828; }
    .badge-replied { background: #e3f2fd; color: #1565c0; }
    .badge-unknown { background: #f5f5f5; color: #999; }

    /* 展开详情 */
    .record-detail {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
    }
    .record-item.expanded .record-detail { display: block; }
    .detail-message {
      font-size: 12px;
      color: #555;
      background: #f9f9f9;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .reply-actions { display: flex; gap: 8px; }
    .reply-btn {
      padding: 4px 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
      color: #555;
      transition: background .15s;
    }
    .reply-btn:hover { background: #f0f0f0; }
    .reply-btn.active { background: #e3f2fd; border-color: #90caf9; color: #1565c0; }

    /* ── 空状态 ───────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: #999;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }

    /* ── 加载更多 ─────────────────────────────── */
    .load-more {
      text-align: center;
      padding: 14px;
    }
    .load-more-btn {
      padding: 8px 24px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      color: #667eea;
      font-size: 13px;
      cursor: pointer;
    }
    .load-more-btn:hover { background: #f5f5f5; }
  </style>
</head>
<body>

  <!-- 顶部栏 -->
  <div class="topbar">
    <span class="topbar-title">📋 发送历史</span>
    <div class="topbar-actions">
      <button class="topbar-btn" id="btnExport">⬇ 导出 CSV</button>
      <button class="topbar-btn" id="btnClearHistory">🗑 清空</button>
    </div>
  </div>

  <!-- 统计卡片 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">总发送</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statSuccess">0%</div>
      <div class="stat-label">成功率</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statReply">0%</div>
      <div class="stat-label">回复率</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statToday">0</div>
      <div class="stat-label">今日发送</div>
    </div>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <select id="filterStatus">
      <option value="all">全部状态</option>
      <option value="success">发送成功</option>
      <option value="failed">发送失败</option>
    </select>
    <select id="filterReply">
      <option value="all">全部回复</option>
      <option value="replied">已回复</option>
      <option value="no_reply">未回复</option>
      <option value="unknown">未知</option>
    </select>
    <input type="date" id="filterDateFrom" title="开始日期" />
    <input type="date" id="filterDateTo"   title="结束日期" />
    <div class="spacer"></div>
  </div>

  <!-- 记录列表 -->
  <div class="list-container" id="listContainer">
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="icon">📭</div>
      <p>暂无发送记录</p>
    </div>
  </div>

  <!-- 加载更多 -->
  <div class="load-more" id="loadMore" style="display:none;">
    <button class="load-more-btn" id="btnLoadMore">加载更多</button>
  </div>

  <script src="history.js"></script>
</body>
</html>
